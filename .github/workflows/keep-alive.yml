name: Keep Supabase Alive

on:
  schedule:
    # Runs every day at midnight UTC (0 0 * * *)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually from GitHub to test it

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY);
            async function run() {
              const { data, error } = await supabase.from('_keep_alive').select('*').limit(1);
              if (error && error.code !== 'PGRST116') {
                console.error('Ping failed:', error);
                process.exit(1);
              }
              console.log('Successfully pinged Supabase!');
            }
            run();
          "
